<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Librería Jesús de la Misericordia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page" id="loginPage">
    <!-- Burbuja decorativa extra -->
    <div class="bubble-extra"></div>

    <!-- BOTÓN DE MODO OSCURO -->
    <button
      class="theme-toggle-login"
      id="themeToggleLogin"
      title="Alternar modo oscuro"
    >
      <i class="fas fa-moon" id="themeIconLogin"></i>
    </button>

    <!-- TARJETA DE LOGIN -->
    <div class="login-card">
      <!-- LOGO -->
      <div class="login-logo-container">
        <img
          src="https://lail-web.github.io/Libreria-y-Papeleria-Jesus-de-la-Misericordia-II-/img/logo.png"
          alt="Logo Librería Jesús de la Misericordia"
        />
      </div>

      <!-- TÍTULO -->
      <h1 class="login-title">
        Bienvenido a <span class="highlight">Jesús de la Misericordia</span>
      </h1>
      <p class="login-subtitle">Sistema de Gestión - Librería y Papelería</p>

      <!-- ALERTA DE ERROR -->
      <div id="loginAlert" class="login-alert login-alert-danger">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMessage">Credenciales incorrectas</span>
      </div>

      <!-- FORMULARIO -->
      <form id="loginForm" autocomplete="off">
        <div class="login-field">
          <label for="nombre_usuario">
            <i class="fas fa-user"></i>Usuario
          </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-user"></i>
            </span>
            <input
              type="text"
              class="form-control"
              id="nombre_usuario"
              placeholder="Ingresa tu usuario"
              required
            />
          </div>
        </div>

        <div class="login-field">
          <label for="password"> <i class="fas fa-lock"></i>Contraseña </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-lock"></i>
            </span>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Ingresa tu contraseña"
              required
            />
            <button
              class="btn btn-outline-secondary"
              type="button"
              id="togglePassword"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="loginText">
            <i class="fas fa-arrow-right-to-bracket"></i>Iniciar Sesión
          </span>
          <span
            id="loginSpinner"
            class="spinner-border spinner-border-sm d-none"
            role="status"
          ></span>
        </button>
      </form>

      <!-- ENLACE AL SITIO WEB -->
      <div class="login-footer-link">
        <a
          href="https://lail-web.github.io/Libreria-y-Papeleria-Jesus-de-la-Misericordia-II-/#servicios"
          target="_blank"
        >
          <i class="fas fa-store"></i>
          Visitar nuestro sitio web
        </a>
      </div>

      <!-- VERSIÓN -->
      <div class="text-center mt-3">
        <p style="font-size: 0.7rem; color: #7a8a9e; opacity: 0.5; margin: 0">
          <i class="fas fa-code me-1"></i>v1.1.0
        </p>
      </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                      -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      (function () {
        "use strict";

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("nombre_usuario");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const loginText = document.getElementById("loginText");
        const loginSpinner = document.getElementById("loginSpinner");
        const loginAlert = document.getElementById("loginAlert");
        const errorMessage = document.getElementById("errorMessage");
        const togglePassword = document.getElementById("togglePassword");
        const themeToggle = document.getElementById("themeToggleLogin");
        const themeIcon = document.getElementById("themeIconLogin");

        // ==========================================
        // REDIRECCIÓN SI YA ESTÁ LOGEADO
        // ==========================================
        if (localStorage.getItem("token")) {
          window.location.href = "index.html";
          return;
        }

        // ==========================================
        // MODO OSCURO - CON FIX PARA EL FONDO
        // ==========================================
        const savedTheme = localStorage.getItem("loginTheme") || "light";
        if (savedTheme === "dark") {
          document.body.classList.add("dark-mode");
          themeIcon.className = "fas fa-sun";
        }

        themeToggle.addEventListener("click", function () {
          document.body.classList.toggle("dark-mode");
          const isDark = document.body.classList.contains("dark-mode");
          localStorage.setItem("loginTheme", isDark ? "dark" : "light");
          themeIcon.className = isDark ? "fas fa-sun" : "fas fa-moon";
        });

        // ==========================================
        // TOGGLE CONTRASEÑA
        // ==========================================
        togglePassword.addEventListener("click", function () {
          const type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);
          const icon = this.querySelector("i");
          icon.classList.toggle("fa-eye");
          icon.classList.toggle("fa-eye-slash");
        });

        // ==========================================
        // ALERTAS
        // ==========================================
        function showError(message) {
          errorMessage.textContent = message;
          loginAlert.classList.add("show");
          setTimeout(() => {
            loginAlert.classList.remove("show");
          }, 5000);
        }

        function hideError() {
          loginAlert.classList.remove("show");
        }

        // ==========================================
        // LOADING
        // ==========================================
        function setLoading(isLoading) {
          if (isLoading) {
            loginText.classList.add("d-none");
            loginSpinner.classList.remove("d-none");
            loginBtn.disabled = true;
          } else {
            loginText.classList.remove("d-none");
            loginSpinner.classList.add("d-none");
            loginBtn.disabled = false;
          }
        }

        // ==========================================
        // ENVÍO DEL FORMULARIO
        // ==========================================
        loginForm.addEventListener("submit", async function (event) {
          event.preventDefault();
          hideError();
          setLoading(true);

          const nombre_usuario = usernameInput.value.trim();
          const password = passwordInput.value.trim();

          if (!nombre_usuario || !password) {
            showError("Por favor completa todos los campos");
            setLoading(false);
            return;
          }

          try {
            const response = await api.login(nombre_usuario, password);

            localStorage.setItem(
              "user",
              JSON.stringify({
                id: response.usuario_id,
                nombre_usuario: response.nombre_usuario,
                rol: response.rol,
              }),
            );

            window.location.href = "index.html";
          } catch (error) {
            console.error("Error de login:", error);
            showError(error.message || "Error al iniciar sesión");
            setLoading(false);
          }
        });

        // ==========================================
        // ENTER KEY EN CAMPOS
        // ==========================================
        usernameInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            passwordInput.focus();
          }
        });

        passwordInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            loginForm.dispatchEvent(new Event("submit"));
          }
        });
      })();
    </script>
  </body>
</html>
