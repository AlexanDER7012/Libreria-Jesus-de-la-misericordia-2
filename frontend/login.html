<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Librería Jesús de la Misericordia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page" id="loginPage">
    <!-- Burbuja decorativa extra -->
    <div class="bubble-extra"></div>

    <div class="login-top-actions">
      <a
        class="site-link-login"
        href="https://lail-web.github.io/Libreria-y-Papeleria-Jesus-de-la-Misericordia-II-/#servicios"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fas fa-store"></i>
        <span>Visitar sitio web</span>
      </a>
      <button
        class="theme-toggle-login"
        id="themeToggleLogin"
        type="button"
        title="Alternar modo oscuro"
        aria-label="Alternar modo oscuro"
      >
        <i class="fas fa-moon" id="themeIconLogin"></i>
      </button>
    </div>

    <!-- TARJETA DE LOGIN -->
    <div class="login-card">
      <div class="login-card-content">
        <!-- LOGO -->
        <div class="login-logo-container">
          <img
            src="https://lail-web.github.io/Libreria-y-Papeleria-Jesus-de-la-Misericordia-II-/img/logo.png"
            alt="Logo Librería Jesús de la Misericordia"
          />
        </div>

        <!-- TÍTULO -->
        <h1 class="login-title">
          Bienvenido a <span class="highlight">Jesús de la Misericordia</span>
        </h1>
        <p class="login-subtitle">Sistema de Gestión - Librería y Papelería</p>

        <!-- ALERTA DE ERROR -->
        <div id="loginAlert" class="login-alert login-alert-danger">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorMessage">Credenciales incorrectas</span>
        </div>
        <div id="adminRecoveryAlert" class="alert d-none" role="alert"></div>

        <!-- FORMULARIO -->
        <form id="loginForm" autocomplete="off">
          <div class="login-field">
            <label for="nombre_usuario">
              <i class="fas fa-user"></i>Usuario
            </label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="fas fa-user"></i>
              </span>
              <input
                type="text"
                class="form-control"
                id="nombre_usuario"
                placeholder="Ingresa tu usuario"
                required
              />
            </div>
          </div>

          <div class="login-field">
            <label for="password">
              <i class="fas fa-lock"></i>Contraseña
            </label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="fas fa-lock"></i>
              </span>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                id="togglePassword"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span id="loginText">
              <i class="fas fa-arrow-right-to-bracket"></i>Iniciar Sesión
            </span>
            <span
              id="loginSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            ></span>
          </button>
        </form>

        <div id="adminRecoveryEntry" class="text-center mt-3 d-none">
          <button
            id="showAdminRecovery"
            class="btn btn-link"
            type="button"
          >
            Recuperar acceso administrativo
          </button>
        </div>

        <section id="adminRecoveryPanel" class="d-none" aria-labelledby="adminRecoveryTitle">
          <h2 id="adminRecoveryTitle" class="h5 text-center mt-3">
            Recuperación de administrador
          </h2>
          <p class="small text-muted">
            Esta opción solo se puede usar una vez. Creará la cuenta
            <strong>soporte_admin</strong> con acceso completo al sistema.
          </p>
          <form id="adminRecoveryForm" autocomplete="off">
            <div class="login-field">
              <label for="adminRecoveryKey">Clave de recuperación</label>
              <input
                type="password"
                class="form-control"
                id="adminRecoveryKey"
                autocomplete="off"
                required
                minlength="32"
              />
            </div>
            <div class="login-field">
              <label for="adminRecoveryPassword">Nueva contraseña (mínimo 12 caracteres)</label>
              <input
                type="password"
                class="form-control"
                id="adminRecoveryPassword"
                autocomplete="new-password"
                required
                minlength="12"
                maxlength="72"
              />
            </div>
            <div class="login-field">
              <label for="adminRecoveryPasswordConfirm">Confirmar contraseña</label>
              <input
                type="password"
                class="form-control"
                id="adminRecoveryPasswordConfirm"
                autocomplete="new-password"
                required
                minlength="12"
                maxlength="72"
              />
            </div>
            <button type="submit" class="btn-login" id="adminRecoveryBtn">
              <span id="adminRecoveryText">Crear cuenta de soporte</span>
              <span
                id="adminRecoverySpinner"
                class="spinner-border spinner-border-sm d-none"
                role="status"
              ></span>
            </button>
            <button
              id="hideAdminRecovery"
              class="btn btn-link w-100 mt-2"
              type="button"
            >
              Volver al inicio de sesión
            </button>
          </form>
        </section>

        <!-- VERSIÓN -->
        <div class="text-center mt-3">
          <p
            style="font-size: 0.7rem; color: #7a8a9e; opacity: 0.5; margin: 0"
          >
            <i class="fas fa-code me-1"></i>v1.1.0
          </p>
        </div>
      </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                      -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      (function () {
        "use strict";

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("nombre_usuario");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const loginText = document.getElementById("loginText");
        const loginSpinner = document.getElementById("loginSpinner");
        const loginAlert = document.getElementById("loginAlert");
        const errorMessage = document.getElementById("errorMessage");
        const togglePassword = document.getElementById("togglePassword");
        const themeToggle = document.getElementById("themeToggleLogin");
        const themeIcon = document.getElementById("themeIconLogin");
        const adminRecoveryEntry = document.getElementById("adminRecoveryEntry");
        const adminRecoveryPanel = document.getElementById("adminRecoveryPanel");
        const adminRecoveryForm = document.getElementById("adminRecoveryForm");
        const adminRecoveryAlert = document.getElementById("adminRecoveryAlert");
        const adminRecoveryBtn = document.getElementById("adminRecoveryBtn");
        const adminRecoveryText = document.getElementById("adminRecoveryText");
        const adminRecoverySpinner = document.getElementById("adminRecoverySpinner");

        // ==========================================
        // REDIRECCIÓN SI YA ESTÁ LOGEADO
        // ==========================================
        const tokenGuardado = localStorage.getItem("token");
        let tokenVigente = false;
        try {
          const payload = JSON.parse(atob(tokenGuardado.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
          tokenVigente = !payload.exp || payload.exp * 1000 > Date.now();
        } catch (e) {
          tokenVigente = false;
        }
        if (tokenGuardado && tokenVigente) {
          window.location.href = "index.html";
          return;
        }
        // Token vencido o dañado: se borra para no rebotar entre páginas
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        localStorage.removeItem("user_permisos");

        api.request("/login/recuperacion-admin/disponible", "GET", null, false)
          .then((estado) => {
            if (estado.disponible) adminRecoveryEntry.classList.remove("d-none");
          })
          .catch((error) => {
            console.error("No se pudo consultar la recuperación de administrador:", error);
          });

        document.getElementById("showAdminRecovery").addEventListener("click", () => {
          loginForm.classList.add("d-none");
          adminRecoveryEntry.classList.add("d-none");
          adminRecoveryPanel.classList.remove("d-none");
        });

        document.getElementById("hideAdminRecovery").addEventListener("click", () => {
          adminRecoveryPanel.classList.add("d-none");
          adminRecoveryEntry.classList.remove("d-none");
          loginForm.classList.remove("d-none");
          adminRecoveryAlert.classList.add("d-none");
        });

        adminRecoveryForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          adminRecoveryAlert.classList.add("d-none");

          const clave = document.getElementById("adminRecoveryKey").value;
          const password = document.getElementById("adminRecoveryPassword").value;
          const confirmacion = document.getElementById("adminRecoveryPasswordConfirm").value;
          if (password !== confirmacion) {
            adminRecoveryAlert.textContent = "Las contraseñas no coinciden.";
            adminRecoveryAlert.className = "alert alert-danger";
            return;
          }

          adminRecoveryBtn.disabled = true;
          adminRecoveryText.classList.add("d-none");
          adminRecoverySpinner.classList.remove("d-none");
          try {
            const resultado = await api.request(
              "/login/recuperacion-admin",
              "POST",
              { clave_recuperacion: clave, password },
              false,
            );
            adminRecoveryPanel.classList.add("d-none");
            loginForm.classList.remove("d-none");
            usernameInput.value = resultado.nombre_usuario;
            passwordInput.focus();
            adminRecoveryAlert.textContent = resultado.mensaje;
            adminRecoveryAlert.className = "alert alert-success";
            loginAlert.classList.remove("show");
            adminRecoveryEntry.classList.add("d-none");
          } catch (error) {
            adminRecoveryAlert.textContent = error.message || "No se pudo recuperar el acceso.";
            adminRecoveryAlert.className = "alert alert-danger";
            adminRecoveryAlert.classList.remove("d-none");
          } finally {
            adminRecoveryBtn.disabled = false;
            adminRecoveryText.classList.remove("d-none");
            adminRecoverySpinner.classList.add("d-none");
          }
        });

        // ==========================================
        // MODO OSCURO - CON FIX PARA EL FONDO
        // ==========================================
        const savedTheme = localStorage.getItem("loginTheme") || "light";
        if (savedTheme === "dark") {
          document.body.classList.add("dark-mode");
          themeIcon.className = "fas fa-sun";
        }

        themeToggle.addEventListener("click", function () {
          document.body.classList.toggle("dark-mode");
          const isDark = document.body.classList.contains("dark-mode");
          localStorage.setItem("loginTheme", isDark ? "dark" : "light");
          themeIcon.className = isDark ? "fas fa-sun" : "fas fa-moon";
        });

        // ==========================================
        // TOGGLE CONTRASEÑA
        // ==========================================
        togglePassword.addEventListener("click", function () {
          const type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);
          const icon = this.querySelector("i");
          icon.classList.toggle("fa-eye");
          icon.classList.toggle("fa-eye-slash");
        });

        // ==========================================
        // ALERTAS
        // ==========================================
        function showError(message) {
          errorMessage.textContent = message;
          loginAlert.classList.add("show");
          setTimeout(() => {
            loginAlert.classList.remove("show");
          }, 5000);
        }

        function hideError() {
          loginAlert.classList.remove("show");
        }

        // ==========================================
        // LOADING
        // ==========================================
        function setLoading(isLoading) {
          if (isLoading) {
            loginText.classList.add("d-none");
            loginSpinner.classList.remove("d-none");
            loginBtn.disabled = true;
          } else {
            loginText.classList.remove("d-none");
            loginSpinner.classList.add("d-none");
            loginBtn.disabled = false;
          }
        }

        // ==========================================
        // ENVÍO DEL FORMULARIO
        // ==========================================
        loginForm.addEventListener("submit", async function (event) {
          event.preventDefault();
          hideError();
          setLoading(true);

          const nombre_usuario = usernameInput.value.trim();
          const password = passwordInput.value.trim();

          if (!nombre_usuario || !password) {
            showError("Por favor completa todos los campos");
            setLoading(false);
            return;
          }

          try {
            const response = await api.login(nombre_usuario, password);

            localStorage.setItem(
              "user",
              JSON.stringify({
                id: response.usuario_id,
                nombre_usuario: response.nombre_usuario,
                rol: response.rol,
              }),
            );

            window.location.href = "index.html";
          } catch (error) {
            console.error("Error de login:", error);
            showError(error.message || "Error al iniciar sesión");
            setLoading(false);
          }
        });

        // ==========================================
        // ENTER KEY EN CAMPOS
        // ==========================================
        usernameInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            passwordInput.focus();
          }
        });

        passwordInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            loginForm.dispatchEvent(new Event("submit"));
          }
        });
      })();
    </script>
  </body>
</html>
