<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Librería Jesús de la Misericordia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
              <!-- Logo -->
              <div class="text-center mb-4">
                <div
                  class="bg-primary bg-gradient text-white rounded-circle d-flex align-items-center justify-content-center mx-auto"
                  style="width: 80px; height: 80px; font-size: 36px"
                >
                  <i class="fas fa-book-open"></i>
                </div>
                <h3 class="mt-3 fw-bold">Librería</h3>
                <p class="text-muted small">Jesús de la Misericordia</p>
                <p class="text-muted small">Sistema de Gestión</p>
              </div>

              <!-- Alerta de error -->
              <div
                id="loginAlert"
                class="alert alert-danger d-none"
                role="alert"
              >
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="errorMessage">Credenciales incorrectas</span>
              </div>

              <!-- Formulario de login -->
              <form id="loginForm" autocomplete="off">
                <div class="mb-3">
                  <label for="nombre_usuario" class="form-label fw-semibold">
                    <i class="fas fa-user me-2 text-primary"></i>Usuario
                  </label>
                  <input
                    type="text"
                    class="form-control form-control-lg rounded-3"
                    id="nombre_usuario"
                    placeholder="admin"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label fw-semibold">
                    <i class="fas fa-lock me-2 text-primary"></i>Contraseña
                  </label>
                  <div class="input-group">
                    <input
                      type="password"
                      class="form-control form-control-lg rounded-3"
                      id="password"
                      placeholder="••••••••"
                      required
                    />
                    <button
                      class="btn btn-outline-secondary rounded-3"
                      type="button"
                      id="togglePassword"
                      style="
                        border-top-left-radius: 0;
                        border-bottom-left-radius: 0;
                      "
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold"
                  id="loginBtn"
                >
                  <span id="loginText">Iniciar Sesión</span>
                  <span
                    id="loginSpinner"
                    class="spinner-border spinner-border-sm d-none"
                    role="status"
                  ></span>
                </button>
              </form>

              <!-- Versión -->
              <div class="text-center mt-4">
                <p class="text-muted small">
                  <i class="fas fa-code me-1"></i>
                  v1.0.0
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Client -->
    <script src="js/api.js"></script>
    <!-- Script de login -->
    <script>
      (function () {
        "use strict";

        // Elementos del DOM
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("nombre_usuario");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const loginText = document.getElementById("loginText");
        const loginSpinner = document.getElementById("loginSpinner");
        const loginAlert = document.getElementById("loginAlert");
        const errorMessage = document.getElementById("errorMessage");
        const togglePassword = document.getElementById("togglePassword");

        // Si ya está logueado, redirigir al dashboard
        if (localStorage.getItem("token")) {
          window.location.href = "index.html";
          return;
        }

        // Toggle mostrar/ocultar contraseña
        togglePassword.addEventListener("click", function () {
          const type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);
          const icon = this.querySelector("i");
          icon.classList.toggle("fa-eye");
          icon.classList.toggle("fa-eye-slash");
        });

        // Mostrar alerta de error
        function showError(message) {
          errorMessage.textContent = message;
          loginAlert.classList.remove("d-none");
          setTimeout(() => {
            loginAlert.classList.add("d-none");
          }, 5000);
        }

        function hideError() {
          loginAlert.classList.add("d-none");
        }

        function setLoading(isLoading) {
          if (isLoading) {
            loginText.classList.add("d-none");
            loginSpinner.classList.remove("d-none");
            loginBtn.disabled = true;
          } else {
            loginText.classList.remove("d-none");
            loginSpinner.classList.add("d-none");
            loginBtn.disabled = false;
          }
        }

        // Enviar formulario
        loginForm.addEventListener("submit", async function (event) {
          event.preventDefault();
          hideError();
          setLoading(true);

          const nombre_usuario = usernameInput.value.trim();
          const password = passwordInput.value.trim();

          if (!nombre_usuario || !password) {
            showError("Por favor completa todos los campos");
            setLoading(false);
            return;
          }

          try {
            const response = await api.login(nombre_usuario, password);

            // Guardar datos del usuario
            localStorage.setItem(
              "user",
              JSON.stringify({
                id: response.usuario_id,
                nombre_usuario: response.nombre_usuario,
                rol: response.rol,
              }),
            );

            // Redirigir al dashboard
            window.location.href = "index.html";
          } catch (error) {
            console.error("Error de login:", error);
            showError(error.message || "Error al iniciar sesión");
            setLoading(false);
          }
        });
      })();
    </script>
  </body>
</html>
